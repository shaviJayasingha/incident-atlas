services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_atlas
      POSTGRES_USER: incident_atlas
      POSTGRES_PASSWORD: incident_atlas_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_atlas -d incident_atlas"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://incident_atlas:incident_atlas_local_only@db:5432/incident_atlas
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      RATE_LIMIT_HMAC_KEY: local-compose-only-change-before-hosting
      LIVE_ANALYSIS_ENABLED: ${LIVE_ANALYSIS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-terra}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /workspace/web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_DATA_MODE: api
    ports:
      - "5173:5173"
    volumes:
      - ./web:/workspace/web
      - web_node_modules:/workspace/web/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
