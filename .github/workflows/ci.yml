name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: incident_atlas_test
          POSTGRES_USER: incident_atlas
          POSTGRES_PASSWORD: incident_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_atlas -d incident_atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://incident_atlas:incident_atlas@localhost:5432/incident_atlas_test
      DATABASE_URL: postgresql+psycopg://incident_atlas:incident_atlas@localhost:5432/incident_atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.9
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev --extra observability
      - name: Migrate and verify repeatable runtime seeding
        run: |
          uv run alembic upgrade head
          uv run python -m incident_atlas.cli seed-runtime > /tmp/seed-first.json
          uv run python -m incident_atlas.cli fixture-manifest > /tmp/manifest-first.json
          uv run python -m incident_atlas.cli seed-runtime > /tmp/seed-second.json
          uv run python -m incident_atlas.cli fixture-manifest > /tmp/manifest-second.json
          diff -u /tmp/seed-first.json /tmp/seed-second.json
          diff -u /tmp/manifest-first.json /tmp/manifest-second.json
          cat /tmp/manifest-first.json
      - name: Run PostgreSQL and backend checks
        run: uv run pytest -q -rs
      - name: Lint backend
        run: uv run ruff check .
      - name: Audit locked Python dependencies
        run: uv audit --locked
      - name: Report deterministic rules evaluation
        run: |
          uv run python -m incident_atlas.cli evaluate-fixtures
          uv run python -m incident_atlas.cli evaluate-expanded

  container:
    needs: backend-postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile -t incident-atlas-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Check browser bundle for server-only credential markers
        run: |
          if grep -R -E 'OPENAI_API_KEY|sk-[A-Za-z0-9]{20,}' dist; then
            echo "Server credential marker found in browser output."
            exit 1
          fi

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: incident_atlas_browser
          POSTGRES_USER: incident_atlas
          POSTGRES_PASSWORD: incident_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_atlas -d incident_atlas_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://incident_atlas:incident_atlas@localhost:5432/incident_atlas_browser
      TEST_DATABASE_URL: postgresql+psycopg://incident_atlas:incident_atlas@localhost:5432/incident_atlas_browser
      ENVIRONMENT: test
      RATE_LIMIT_HMAC_KEY: ci-browser-smoke-key
      LIVE_ANALYSIS_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.9
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Migrate and seed browser environment
        working-directory: api
        run: |
          uv sync --locked --extra dev --extra observability
          uv run alembic upgrade head
          uv run python -m incident_atlas.cli seed-runtime
      - name: Install web dependencies and browser
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start local services and run browser journey
        run: |
          cd api
          uv run uvicorn incident_atlas.main:app --host 127.0.0.1 --port 8000 > /tmp/incident-atlas-api.log 2>&1 &
          api_pid=$!
          cd ../web
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/incident-atlas-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          api_ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null; then api_ready=1; break; fi
            sleep 1
          done
          web_ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then web_ready=1; break; fi
            sleep 1
          done
          test "$api_ready" = 1
          test "$web_ready" = 1
          npm run test:e2e
      - name: Show local service logs on failure
        if: failure()
        run: |
          cat /tmp/incident-atlas-api.log || true
          cat /tmp/incident-atlas-web.log || true
