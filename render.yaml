services:
  - type: web
    name: incident-atlas-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    preDeployCommand: uv run --no-sync python -m incident_atlas.cli deploy-bootstrap
    dockerCommand: ./docker-start.sh
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        # Pin the original migration credential before creating a separate
        # Render-managed runtime credential. A dynamic connectionString may follow
        # the database's default credential when Render rotates it.
        sync: false
      - key: RUNTIME_DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_SITE_ORIGIN
        sync: false
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: RATE_LIMIT_HMAC_KEY
        generateValue: true
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIVE_GLOBAL_RUNS
        value: "5"
      - key: RATE_LIVE_GLOBAL_WINDOW_SECONDS
        value: "86400"
      - key: LIVE_ANALYSIS_ENABLED
        value: "false"
      - key: LIVE_PROVIDER_VERIFIED
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-6.1-terra
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: incident-atlas-db
    databaseName: incident_atlas
    user: incident_atlas
    plan: basic-256mb
    region: oregon
