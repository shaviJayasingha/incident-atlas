services:
  - type: web
    name: incident-atlas-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: incident-atlas-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_HMAC_KEY
        generateValue: true
      - key: LIVE_ANALYSIS_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.1-terra
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: incident-atlas-db
    databaseName: incident_atlas
    user: incident_atlas
    plan: basic-256mb
    region: oregon
